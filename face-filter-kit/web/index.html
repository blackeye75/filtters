<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Face Filter Preview</title>
  <style>
    :root { color-scheme: dark; --bg: #0e0f12; --panel: #17191e; --line: #262a31; --text: #e8e9ec; --muted: #8b909a; --accent: #e0607e; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
    main { display: grid; grid-template-columns: 1fr 320px; height: 100vh; }
    .stage { position: relative; display: grid; place-items: center; overflow: hidden; }
    canvas { max-width: 100%; max-height: 100vh; transform: scaleX(-1); background: #000; } /* mirror preview only; the stream is not mirrored */
    .hud { position: absolute; left: 12px; top: 12px; font: 12px ui-monospace, monospace; background: #000a; padding: 6px 8px; border-radius: 6px; white-space: pre; }
    .status { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
    aside { background: var(--panel); border-left: 1px solid var(--line); padding: 16px; overflow-y: auto; }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 20px 0 8px; }
    h2:first-child { margin-top: 0; }
    .presets { display: flex; flex-wrap: wrap; gap: 6px; }
    .presets button { display: flex; align-items: center; gap: 6px; background: #1f2228; color: var(--text); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; cursor: pointer; }
    .presets button[aria-pressed="true"] { border-color: var(--accent); }
    .sw { width: 12px; height: 12px; border-radius: 50%; }
    label { display: grid; grid-template-columns: 92px 1fr 34px; align-items: center; gap: 8px; margin: 6px 0; color: var(--muted); }
    label output { text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }
    input[type=range] { width: 100%; accent-color: var(--accent); }
    input[type=color] { width: 100%; height: 26px; border: 1px solid var(--line); background: none; border-radius: 6px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; margin: 6px 0; color: var(--muted); }
    .row label { display: flex; gap: 6px; margin: 0; }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; height: auto; } canvas { max-height: 60vh; } }
  </style>
</head>
<body>
<main>
  <section class="stage">
    <canvas id="out"></canvas>
    <div class="hud" id="hud"></div>
    <div class="status" id="status">Starting camera…</div>
    <video id="cam" playsinline muted hidden></video>
  </section>
  <aside>
    <h2>Look</h2>
    <div class="presets" id="presets"></div>

    <h2>Lips</h2>
    <div class="row"><label><input type="checkbox" id="lips.enabled" checked /> On</label></div>
    <label>Colour <input type="color" id="lips.color" /> <span></span></label>
    <label>Strength <input type="range" id="lips.opacity" min="0" max="1" step="0.01" /><output></output></label>
    <label>Coverage <input type="range" id="lips.coverage" min="0" max="1" step="0.01" /><output></output></label>
    <label>Texture <input type="range" id="lips.texture" min="0" max="1" step="0.01" /><output></output></label>
    <label>Gloss <input type="range" id="lips.gloss" min="0" max="1" step="0.01" /><output></output></label>
    <label>Edge snap <input type="range" id="lips.refine" min="0" max="1" step="0.01" /><output></output></label>

    <h2>Blush</h2>
    <div class="row"><label><input type="checkbox" id="blush.enabled" checked /> On</label></div>
    <label>Colour <input type="color" id="blush.color" /> <span></span></label>
    <label>Intensity <input type="range" id="blush.intensity" min="0" max="1" step="0.01" /><output></output></label>

    <h2>Skin</h2>
    <div class="row"><label><input type="checkbox" id="skin.enabled" checked /> On</label></div>
    <label>Smooth <input type="range" id="skin.smooth" min="0" max="1" step="0.01" /><output></output></label>
    <label>Keep pores <input type="range" id="skin.poreKeep" min="0" max="1" step="0.01" /><output></output></label>
    <label>Brighten <input type="range" id="skin.brighten" min="0" max="1" step="0.01" /><output></output></label>
    <label>Bronze <input type="range" id="skin.tan" min="0" max="1" step="0.01" /><output></output></label>

    <h2>Face shape</h2>
    <div class="row"><label><input type="checkbox" id="shape.enabled" checked /> On</label></div>
    <label>Slim cheeks <input type="range" id="shape.faceSlim" min="0" max="1" step="0.01" /><output></output></label>
    <label>V-line jaw <input type="range" id="shape.vLine" min="0" max="1" step="0.01" /><output></output></label>
    <label>Chin <input type="range" id="shape.chin" min="-1" max="1" step="0.01" /><output></output></label>
    <label>Slim nose <input type="range" id="shape.noseSlim" min="0" max="1" step="0.01" /><output></output></label>
    <label>Big eyes <input type="range" id="shape.eyes" min="0" max="1" step="0.01" /><output></output></label>
    <label>Fuller lips <input type="range" id="shape.lipPlump" min="0" max="1" step="0.01" /><output></output></label>

    <h2>Tone</h2>
    <div class="row"><label><input type="checkbox" id="tone.enabled" checked /> On</label></div>
    <label>Warmth <input type="range" id="tone.warmth" min="-1" max="1" step="0.01" /><output></output></label>
    <label>Saturation <input type="range" id="tone.saturation" min="-1" max="1" step="0.01" /><output></output></label>
    <label>Contrast <input type="range" id="tone.contrast" min="-1" max="1" step="0.01" /><output></output></label>
    <label>Brightness <input type="range" id="tone.brightness" min="-1" max="1" step="0.01" /><output></output></label>
    <label>Glow <input type="range" id="tone.glow" min="0" max="1" step="0.01" /><output></output></label>
    <label>Vignette <input type="range" id="tone.vignette" min="0" max="1" step="0.01" /><output></output></label>
    <label>Sharpen <input type="range" id="tone.sharpen" min="0" max="1" step="0.01" /><output></output></label>

    <h2>View</h2>
    <div class="row">
      <label><input type="checkbox" id="split" /> Before / after</label>
      <label><input type="checkbox" id="masks" /> Show masks</label>
    </div>
  </aside>
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
